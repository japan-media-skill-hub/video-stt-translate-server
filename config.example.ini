[llm]
base_url = https://www.right.codes/codex/v1
api_key = <YOUR_API_KEY>
model = gpt-5.4-mini

[llm_fallback]
enabled = false
base_url = https://www.right.codes/codex/v1
api_key = <YOUR_BACKUP_API_KEY>
model = gpt-5.3-codex

[security]
# 空 token = 鉴权关闭（启动 WARN）。require_token=true 时为空/占位会导致 **拒绝启动**。
api_token = <CHANGE_ME_STRONG_TOKEN>
# true 且 token 为空 → 拒绝启动；false 表示显式放开鉴权，风险自负。
require_token = true
# false 时含 <> 或示例值的占位 token 一律拒绝启动。
allow_placeholder_token = false
# /docs、/redoc、/openapi.json：关闭时返回 404；开启时仍受 token 保护。
docs_enabled = false
# 逗号分隔；非空时视频路径 resolve 后必须位于其下（空 = 不限制）。
allowed_video_roots =
# 逗号分隔；非空时 copy_back 目标必须位于其下（空 = 仅允许视频所在目录）。
allowed_copy_back_roots =
# 仅供启动脚本读取：默认只监听回环地址，公网部署必须前置反向代理 + TLS。
bind_host = 127.0.0.1
bind_port = 18000

[translation]
# 并发上限 2（D2 决策）；旧配置里的 parallel = 16 仍会被读成 16，请改回 2。
parallel = 2
batch_size = 200
# 单批最大字符数（按 时间窗 / 条目数 / 字符数 三重上限取先到者）。
max_chars = 12000
chunk_minutes = 20
request_interval = 1.0
retry = 10
timeout = 240
sleep = 0.2
disable_proxy = true
copy_back = __video_dir__
# 按批检查点续跑（kill 后重跑只补未完成批次）；false 仅用于排障。
checkpoint_enabled = true
# true 时翻译返回缺 id 直接整批失败；false（默认）保留日文原文并告警。
strict_ids = false
# 检查点保留秒数（任务成功后由清理逻辑回收）。
progress_ttl_sec = 604800

[workers]
extract_workers = 10
stt_workers = 8
stt_whisperx_workers = 2
translate_workers = 8
scheduler_interval_sec = 180
poll_interval_sec = 1

[timeouts]
extract_timeout_sec = 3600
stt_timeout_sec = 7200
stt_whisperx_timeout_sec = 7200
translate_timeout_sec = 7200
lease_timeout_sec = 600
# 批次1（A.6）：drain 停机等待在途任务的上限；超时强制回滚本进程 claimed 并退出。
drain_timeout_sec = 300

[retry]
extract_max_retries = 2
stt_max_retries = 2
stt_whisperx_max_retries = 2
translate_max_retries = 2

[runtime]
db_path = ./tmp/whisper_stt_service.db
progress_ttl_sec = 3600
log_root = ./tmp/logs
artifact_root = ./tmp/artifacts
artifact_cleanup_enabled = true
artifact_cleanup_interval_sec = 3600
artifact_cleanup_statuses = succeeded
model_path = /abs/path/to/faster-whisper-model
# 批次1（A.5）：启动恢复 claimed 任务时是否消耗一次重试预算；false 仅用于调试。
recovery_counts_as_attempt = true
# 批次1（F）：SQLite 启用 WAL（含 busy_timeout）；网络盘等场景可置 false 回退 DELETE。
sqlite_wal_enabled = true
# 进程内模型缓存容量（LRU；0 = 不缓存，仅调试）与单模型并发上限（SPEC D）。
model_cache_size = 2
model_parallelism = 1

# 可观测性（SPEC G）：log_jsonl=true 时 log_root/service.log 每行一个 JSON。
[observability]
log_level = INFO
log_jsonl = false
# false 时 /metrics 不注册（返回 404），其余观测能力（健康检查/日志）保留。
metrics_enabled = true

[stt]
device = auto
compute_type = auto
batch_size = 8
beam_size = 5
best_of = 5
patience = 1.0
condition_on_previous_text = false
vad_filter = true
vad_threshold = 0.45
vad_min_speech_duration_ms = 200
vad_max_speech_duration_s = 18
vad_min_silence_duration_ms = 700
vad_speech_pad_ms = 300
no_speech_threshold = 0.6
compression_ratio_threshold = 2.2
log_prob_threshold = -1.0
hallucination_silence_threshold = 1.5
initial_prompt =
hotwords =

[stt_whisperx]
model = /abs/path/to/faster-whisper-model
device = auto
compute_type = auto
batch_size = 16
vad_config_path = /home/base/repo/video-stt-whisper-server/models/whisperx/vad/pyannote/config.yaml
align_model_root = /home/base/repo/video-stt-whisper-server/models/whisperx/align
align_enabled = true
vad_backend = pyannote
vad_onset = 0.35
vad_offset = 0.2
local_files_only = true