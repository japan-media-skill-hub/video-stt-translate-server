[llm]
base_url = https://www.right.codes/codex/v1
api_key = <YOUR_API_KEY>
model = gpt-5.4-mini

[llm_fallback]
enabled = false
base_url = https://www.right.codes/codex/v1
api_key = <YOUR_BACKUP_API_KEY>
model = gpt-5.3-codex

[security]
# 空 token = 鉴权关闭（启动 WARN）。require_token=true 时为空/占位会导致 **拒绝启动**。
api_token = <CHANGE_ME_STRONG_TOKEN>
# true 且 token 为空 → 拒绝启动；false 表示显式放开鉴权，风险自负。
require_token = true
# false 时含 <> 或示例值的占位 token 一律拒绝启动。
allow_placeholder_token = false
# /docs、/redoc、/openapi.json：关闭时返回 404；开启时仍受 token 保护。
docs_enabled = false
# 逗号分隔；非空时视频路径 resolve 后必须位于其下（空 = 不限制）。
allowed_video_roots =
# 逗号分隔；非空时 copy_back 目标必须位于其下（空 = 仅允许视频所在目录）。
allowed_copy_back_roots =
# 仅供启动脚本读取：默认只监听回环地址，公网部署必须前置反向代理 + TLS。
bind_host = 127.0.0.1
bind_port = 18000

[translation]
# 并发上限（D2 决策，2026-11-01 起为 4）；旧配置里的 parallel = 16 仍会被读成 16，请改回 4。
parallel = 4
# 单批条目数上限（2026-11-01 由 200 降到 100，验收后进一步降到 50）：
# 批次越大，单批 completion 越高、越容易撞上游输出上限而被截断，表现为 parse 错误后
# 重试空转（实测 100 条时 completion 达 13773–22974、finish_reason=error；
# 25 条时 16.6s 稳定成功；50 条为验收后采用的折中值，未再回归）。
batch_size = 50
# 单批最大字符数（按 时间窗 / 条目数 / 字符数 三重上限取先到者）。
max_chars = 12000
chunk_minutes = 20
request_interval = 1.0
retry = 10
timeout = 240
# 单次请求输出 token 上限：必须显式下发，避免长译文被上游默认上限截断（0 = 不下发）。
# 2026-11-01 验收后由 16000 提到 20000：该路由的思考 token 计入 completion
# （reasoning.enabled=false 只减不关，实测仍烧 5.7k~13k），上限要留够"思考 + 正文"。
max_tokens = 20000
# 关思考：请求体仍下发 reasoning: {"enabled": false}（用户决定保留）。
# 注意（2026-11-01 验收实测）：该路由上此参数**只减不关**——同一批 40 条仍产生
# 7185 个 reasoning token（不传该字段为 12676），故思考开销必须按"不可避免"设计超时与批次。
reasoning_enabled = false
sleep = 0.2
disable_proxy = true
copy_back = __video_dir__
# 按批检查点续跑（kill 后重跑只补未完成批次）；false 仅用于排障。
checkpoint_enabled = true
# true 时翻译返回缺 id 直接整批失败；false（默认）保留日文原文并告警。
strict_ids = false
# 检查点保留秒数（任务成功后由清理逻辑回收）。
progress_ttl_sec = 604800

[workers]
extract_workers = 10
stt_workers = 8
stt_qwen_workers = 1
stt_whisperx_workers = 2
translate_workers = 8
scheduler_interval_sec = 180
poll_interval_sec = 1

[timeouts]
extract_timeout_sec = 3600
stt_timeout_sec = 7200
stt_qwen_timeout_sec = 5400
stt_whisperx_timeout_sec = 7200
translate_timeout_sec = 7200
lease_timeout_sec = 600
# 批次1（A.6）：drain 停机等待在途任务的上限；超时强制回滚本进程 claimed 并退出。
drain_timeout_sec = 300

[retry]
extract_max_retries = 2
stt_max_retries = 2
stt_qwen_max_retries = 2
stt_whisperx_max_retries = 2
translate_max_retries = 2

[runtime]
db_path = ./tmp/whisper_stt_service.db
progress_ttl_sec = 3600
log_root = ./tmp/logs
artifact_root = ./tmp/artifacts
artifact_cleanup_enabled = true
artifact_cleanup_interval_sec = 3600
artifact_cleanup_statuses = succeeded
model_path = /abs/path/to/faster-whisper-model
# 批次1（A.5）：启动恢复 claimed 任务时是否消耗一次重试预算；false 仅用于调试。
recovery_counts_as_attempt = true
# 批次1（F）：SQLite 启用 WAL（含 busy_timeout）；网络盘等场景可置 false 回退 DELETE。
sqlite_wal_enabled = true
# 进程内模型缓存容量（LRU；0 = 不缓存，仅调试）与单模型并发上限（SPEC D）。
model_cache_size = 2
model_parallelism = 1

# 可观测性（SPEC G）：log_jsonl=true 时 log_root/service.log 每行一个 JSON。
[observability]
log_level = INFO
log_jsonl = false
# false 时 /metrics 不注册（返回 404），其余观测能力（健康检查/日志）保留。
metrics_enabled = true

[stt]
device = auto
compute_type = auto
batch_size = 8
beam_size = 5
best_of = 5
patience = 1.0
condition_on_previous_text = false
vad_filter = true
vad_threshold = 0.45
vad_min_speech_duration_ms = 200
vad_max_speech_duration_s = 18
vad_min_silence_duration_ms = 700
vad_speech_pad_ms = 300
no_speech_threshold = 0.6
compression_ratio_threshold = 2.2
log_prob_threshold = -1.0
hallucination_silence_threshold = 1.5
initial_prompt =
hotwords =

# ---------------------------------------------------------------------------
# stt_qwen：本地离线 Qwen3-ASR 阶段（与 stt / stt_whisperx 并列的第三个 ASR）
#
# 切片策略：FireRedVAD 在一段[t nominal ± 窗]内找**真实语音边界**定点切片，
#          名义目标锚定上一刀（不是固定网格），参数全部可配。
# 片长上界 = nominal_seconds + fallback_forward_seconds，且**绝对不得超过 180s**
#          （Qwen3-ForcedAligner 单次调用上限；超过会被包内二次切分，定点全废）。
#
# 两套已实测档位（只改配置，不改代码）：
#   本轮落地：nominal=30 / Δback=20 / Δfwd=20 / fallback_fwd=40 → 上界 70s / batch=10
#   目标档　：nominal=50 / Δback=20 / Δfwd=20 / fallback_fwd=30 → 上界 80s / batch=13
# ---------------------------------------------------------------------------
[stt_qwen]
# 本地权重目录（相对路径按本配置文件所在目录解析；运行期禁止联网下载）。
model_dir = ../models/qwen3-asr/Qwen3-ASR-1.7B
aligner_dir = ../models/qwen3-asr/Qwen3-ForcedAligner-0.6B
vad_model_dir = ../models/vad/fireredvad/VAD
# 固定设备，不做 auto：落点写错时宁可 fail-fast，也不要静默跑在 CPU 上。
device = cuda:0
dtype = bfloat16
require_cuda = true
# 加载前空闲显存门槛（GiB）；实测峰值 9.6~11.9GB，不足即失败而不是等 OOM。
min_free_vram_gb = 12.0
vad_use_gpu = true
vad_speech_threshold = 0.4
# ---- 切片参数（本轮落地档）----
nominal_seconds = 30
delta_back_seconds = 20
delta_forward_seconds = 20
fallback_forward_seconds = 40
min_chunk_seconds = 10
hard_cut_on_miss = true
batch_size = 10
# 每片字符预算系数（字/秒）：max_new_tokens = clamp(ceil(最长片×该值), 256, 2048)。
# 退化生成会一路打到上限，上限直接决定耗时（实测 64/512/2048 → 3.7s/21.7s/85.9s）。
tokens_per_sec = 16
# 字幕单段上限（复用 common.clean_segment_timeline，与 stt/stt_whisperx 同一函数）。
max_segment_sec = 30
# 末条结束时间 / 音频时长低于该比例即告警 stt_qwen_output_incomplete。
min_coverage = 0.98
# true 时覆盖率不足直接判任务失败（默认 false：告警不失败）。
strict_output = false
# 对齐结果缺失（time_stamps is None）时的兜底：退回片边界出单行（不丢内容）。
align_missing_fallback = chunk_boundary

[stt_whisperx]
model = /abs/path/to/faster-whisper-model
device = auto
compute_type = auto
batch_size = 16
vad_config_path = /home/base/repo/video-stt-whisper-server/models/whisperx/vad/pyannote/config.yaml
align_model_root = /home/base/repo/video-stt-whisper-server/models/whisperx/align
align_enabled = true
vad_backend = pyannote
vad_onset = 0.35
vad_offset = 0.2
local_files_only = true